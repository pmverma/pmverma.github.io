<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="author" content="Pm Verma">
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pm_verma" />
    <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}" />
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}" />
    <meta name="twitter:url" content="{{ page.url | absolute_url }}" />
    <!-- Chrome, Firefox OS and Opera -->
    <meta name="theme-color" content="#353d47">
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#353d47">
    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-status-bar-style" content="#353d47">
    <title>{{ page.title | default: site.title | escape }}</title>

    <link rel="alternate" href="{{ site.url }}" hreflang="en" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&family=Montserrat:wght@400;700&family=Pacifico&family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet">

    <!-- CSS Libs -->
    <link rel="stylesheet" type="text/css" href="/lib/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/lib/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="/lib/css/animate.min.css">
    <link rel="stylesheet" type="text/css" href="/lib/css/font-awesome-animation.min.css">

    <!-- CSS App -->
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <link rel="stylesheet" type="text/css" href="/css/themes/flat-blue.css">
    {% if page.home == true %}
    <link rel="stylesheet" type="text/css" href="/css/home.css">
    {% endif %}
    <!-- Bootstrap Docs CSS subset to get icon -->
    <!--<link href="/css/bootstrap-docs.css" rel="stylesheet">-->

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    <!-- Favicon with QHD -->
    <link rel="icon" type="image/png" href="{{ '/images/favicon-32x32.png' | relative_url }}" sizes="32x32" />
    <link rel="icon" type="image/png" href="{{ '/images/favicon-16x16.png' | relative_url }}" sizes="16x16" />

</head>

<body class="flat-blue">
    <div class="wrapper">
        <div class="row content-container">
            <nav class="navbar navbar-inverse navbar-fixed-top navbar-top" role="navigation">
                <div class="container-fluid">
                    <div class="navbar-header">
                        <ol class="breadcrumb navbar-breadcrumb">
                            <li class="active"></li>
                        </ol>
                        <button type="button" class="navbar-right-expand-toggle pull-right visible-xs">
                        <i class="fa fa-th icon"></i>
                        </button>
                    </div>

                    <ul class="nav navbar-nav navbar-right">
                        <button type="button" class="navbar-right-expand-toggle pull-right visible-xs light">
                            <i class="fa fa-times icon"></i>
                        </button>
                        <li class="page-scroll">
                            <a href="#about">About</a>
                        </li>
                        <li class="page-scroll">
                            <a href="#projects">Projects</a>
                        </li>
                        <!--<li class="page-scroll">-->
                        <!--    <a href="#products">Products</a>-->
                        <!--</li>-->
                        <!--<li class="page-scroll">-->
                        <!--    <a href="/blog">Blog</a>-->
                        <!--</li>-->
                        <li><a href="#connect">Connect</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->

            <div id="page-wrapper">
                <div id="page-top">
                    {{ content }}
                    <!-- Footer -->
                    <footer class="text-center">
                        <div class="footer-above">
                            <div class="container">
                                <div id="connect">
                                    <div class="footer-col col-md-12">
                                        <h4>Connect with me:</h4>
                                    </div>
                                    <div class="footer-col col-md-12">
                                        <ul class="list-inline">
                                            <li>
                                                <a href="https://twitter.com/pm_verma" target="_blank" rel="noopener noreferrer" aria-label="Pm Verma on Twitter" class="btn-social btn-outline"><i class="fa fa-lg fa-twitter" aria-hidden="true"></i></a>
                                            </li>
                                            <li>
                                                <a href="https://github.com/pmverma" target="_blank" rel="noopener noreferrer" aria-label="Pm Verma on GitHub" class="btn-social btn-outline"><i class="fa fa-lg fa-github" aria-hidden="true"></i></a>
                                            </li>
                                            <li>
                                                <a href="https://www.linkedin.com/in/pmverma" target="_blank" rel="noopener noreferrer" aria-label="Pm Verma on LinkedIn" class="btn-social btn-outline"><i class="fa fa-lg fa-linkedin" aria-hidden="true"></i></a>
                                            </li>
                                            <li>
                                                <a href="https://www.facebook.com/pm.verma.5" target="_blank" rel="noopener noreferrer" aria-label="Pm Verma on Facebook" class="btn-social btn-outline"><i class="fa fa-lg fa-facebook" aria-hidden="true"></i></a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="footer-below">
                            <div class="container">
                                <div class="row">
                                    <div class="col-lg-12">
                                        <div class="rights">
                                            Copyright &copy; {{ 'now' | date: '%Y' }} Pm Verma. All rights reserved.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
                <!-- Scroll to Top Button (Only visible on small and extra-small screen sizes) -->
                <div class="scroll-top page-scroll visible-xs visible-sm">
                    <a class="btn btn-primary" href="#page-top">
                        <i class="fa fa-chevron-up"></i>
                    </a>
                </div>
            </div>
            <!-- /#page-wrapper -->
        </div>
        <!-- /#wrapper -->
    </div>
    <!-- Javascript Libs -->
    <script type="text/javascript" src="/lib/js/jquery.min.js"></script>
    <script type="text/javascript" src="/lib/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="/lib/js/jquery.easing.min.js"></script>
    <!-- App JS-->
    <script type="text/javascript" src="/js/index.js"></script>
    <!-- JavaScript -->
</body>

</html>
